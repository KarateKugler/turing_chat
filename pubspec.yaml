name: turing_chat
description: turing test chat game
publish_to: 'none'
version: 0.0.1+2

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  supabase_api:
    path: packages/supabase_api
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  timeago: ^3.7.0
  flutter_dotenv: ^5.2.1
  custom_refresh_indicator: ^4.0.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.4+1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon4.png"
  min_sdk_android: 21 # android min sdk min:16, default 21